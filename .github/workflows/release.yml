name: Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ACODE_API_KEY: ${{ secrets.ACODE_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build plugin and pack zip
        run: npm run build

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: acode-9router.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Acode Marketplace
        uses: Acode-Foundation/publish-plugin@v1
        if: env.ACODE_API_KEY != ''
        with:
          api-key: ${{ secrets.ACODE_API_KEY }}
          zip: acode-9router.zip
          create-if-missing: true

